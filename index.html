<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cloudflare.com">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      transition: background 0.5s ease;
    }

    /* Dynamic Weather Backgrounds */
    body.rain { background: linear-gradient(135deg, #4ca1af, #c4e0e5); }
    body.clouds { background: linear-gradient(135deg, #757f9a, #d7dde8); }
    body.clear { background: linear-gradient(135deg, #f2994a, #f2c94c); }
    body.snow { background: linear-gradient(135deg, #e6dada, #274046); }

    .dashboard-container {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      color: #fff;
    }

    header h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .search-box input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      background: rgba(255, 255, 255, 0.9);
      font-size: 1rem;
      color: #333;
    }

    .search-box button {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #ff5722;
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    .search-box button:hover {
      background: #e64a19;
    }

    #locationBtn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
    }

    #locationBtn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .error-msg {
      background: #d32f2f;
      color: white;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 0.9rem;
    }

    .hidden {
      display: none !important;
    }

    .weather-card {
      text-align: center;
      margin-bottom: 25px;
    }

    .city-info h2 {
      font-size: 2rem;
      margin-bottom: 4px;
    }

    .city-info p {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .weather-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }

    .weather-main img {
      width: 90px;
      height: 90px;
    }

    .temp-container span {
      font-size: 2.5rem;
      font-weight: bold;
      display: block;
    }

    .temp-container p {
      text-transform: capitalize;
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .weather-details {
      display: flex;
      justify-content: space-around;
      background: rgba(0, 0, 0, 0.2);
      padding: 15px;
      border-radius: 12px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .detail-item i {
      font-size: 1.2rem;
      margin-bottom: 2px;
    }

    .detail-item span {
      font-size: 0.85rem;
      opacity: 0.8;
    }

    .detail-item p {
      font-weight: bold;
    }

    .forecast-section h3 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 5px;
    }

    .forecast-container {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .forecast-card {
      flex: 1;
      background: rgba(0, 0, 0, 0.2);
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }

    .forecast-card p {
      font-size: 0.9rem;
    }

    .forecast-card img {
      width: 45px;
      height: 45px;
      margin: 5px 0;
    }

    @media (max-width: 480px) {
      .dashboard-container {
        padding: 15px;
      }
      .forecast-container {
        flex-direction: column;
      }
      .forecast-card {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 15px;
      }
      .forecast-card img {
        margin: 0;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard-container" id="dashboard">
    <header>
      <h1>Weather Dashboard</h1>
      <div class="search-box">
        <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off">
        <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
        <button id="locationBtn" title="Use current location"><i class="fa-solid fa-location-crosshairs"></i></button>
      </div>
    </header>

    <!-- Error Message Banner -->
    <div id="errorMsg" class="error-msg hidden">City not found. Please try again.</div>

    <!-- Current Weather Card -->
    <main class="weather-card" id="weatherCard">
      <div class="city-info">
        <h2 id="cityName">--</h2>
        <p id="currentDate">--</p>
      </div>

      <div class="weather-main">
        <img id="weatherIcon" src="" alt="Weather Icon">
        <div class="temp-container">
          <span id="temperature">--°C</span>
          <p id="weatherCondition">--</p>
        </div>
      </div>

      <div class="weather-details">
        <div class="detail-item">
          <i class="fa-solid fa-droplet" style="color: #3498db;"></i>
          <span>Humidity</span>
          <p id="humidity">--%</p>
        </div>
        <div class="detail-item">
          <i class="fa-solid fa-wind" style="color: #2ecc71;"></i>
          <span>Wind Speed</span>
          <p id="windSpeed">-- km/h</p>
        </div>
      </div>
    </main>

    <!-- 3-Day Forecast -->
    <section class="forecast-section">
      <h3>3-Day Forecast</h3>
      <div class="forecast-container" id="forecastContainer">
        <!-- Script injects forecast panels here -->
      </div>
    </section>
  </div>

  <script>
    const cityInput = document.getElementById('cityInput');
    const searchBtn = document.getElementById('searchBtn');
    const locationBtn = document.getElementById('locationBtn');
    const errorMsg = document.getElementById('errorMsg');

    const cityNameEl = document.getElementById('cityName');
    const currentDateEl = document.getElementById('currentDate');
    const temperatureEl = document.getElementById('temperature');
    const weatherConditionEl = document.getElementById('weatherCondition');
    const weatherIconEl = document.getElementById('weatherIcon');
    const humidityEl = document.getElementById('humidity');
    const windSpeedEl = document.getElementById('windSpeed');
    const forecastContainer = document.getElementById('forecastContainer');
    const bodyEl = document.body;

    // Helper to map Open-Meteo WMO weather codes to display conditions and backgrounds
    const getWeatherInfo = (code) => {
      const codeMaps = [
        { codes:, text: 'Clear Sky', icon: '01d', class: 'clear' },
        { codes:, text: 'Partly Cloudy', icon: '02d', class: 'clouds' },
        { codes:, text: 'Foggy', icon: '50d', class: 'clouds' },
        { codes:, text: 'Rainy', icon: '10d', class: 'rain' },
        { codes:, text: 'Snowy', icon: '13d', class: 'snow' },
        { codes:, text: 'Thunderstorm', icon: '11d', class: 'rain' }
      ];
      
      const match = codeMaps.find(item => item.codes.includes(code));
      return match ? match : { text: 'Overcast', icon: '03d', class: 'clouds' };
    };

    // Geocoding: Look up coordinate values from text input
    async function fetchCoordinates(city) {
      const response = await fetch(`https://open-meteo.com{encodeURIComponent(city)}&count=1&language=en&format=json`);
      const data = await response.json();
      if (!data.results || data.results.length === 0) {
        throw new Error('City not found');
      }
      return data.results[0];
    }

    // Weather Fetching Engine (No API Key Required)
    async function fetchWeather(lat, lon, name, country) {
      try {
        const url = `https://open-meteo.com{lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
        const response = await fetch(url);
        const data = await response.json();

        errorMsg.classList.add('hidden');
        updateUI(data, name, country);
      } catch (err) {
        showError();
      }
    }

    // UI Updates
    function updateUI(data, name, country) {
      const current = data.current;
      const weatherInfo = getWeatherInfo(current.weather_code);

      cityNameEl.textContent = `${name}${country ? ', ' + country : ''}`;
      currentDateEl.textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
      temperatureEl.textContent = `${Math.round(current.temperature_2m)}°C`;
      weatherConditionEl.textContent = weatherInfo.text;
      weatherIconEl.src = `https://openweathermap.org{weatherInfo.icon}@2x.png`;
      humidityEl.textContent = `${current.relative_humidity_2m}%`;
      windSpeedEl.textContent = `${Math.round(current.wind_speed_10m)} km/h`;

      // Assign dynamic background rules
      bodyEl.className = '';
      if (weatherInfo.class) bodyEl.classList.add(weatherInfo.class);

      // Render 3-Day Forecast System
      forecastContainer.innerHTML = '';
